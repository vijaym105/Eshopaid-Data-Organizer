spring.application.name=data-processor

# API endpoint
purchase.return.api.url=https://spykar-int.eshopaid.com/eShopaidRestService/eShopaidService.svc/ProcessData

# Authentication token location
purchase.return.token.file=D:/Data Collector/API-Authentication/token/token.json

# Base directory for processed JSON
processor.output.directory=D:/Data Collector/Processed-Data

# Run as a background console application
spring.main.web-application-type=none

# Logging
logging.file.name=D:/Data Collector/Processed-Data/logs/data-processor.log
logging.level.root=INFO
logging.level.DataCollector=INFO